# cvfree, the open-source resume builder.
#
#   cp .env.example .env        (then edit it)
#   docker compose up -d        (http://your-server:3000)
#
# With your own domain and automatic HTTPS (ports 80 and 443 must be free):
#   set DOMAIN in .env, then
#   docker compose --profile https up -d

# Fixed project name, so the volume is always "cvfree_cvfree-data" whatever the folder is called.
name: cvfree

services:
  cvfree:
    build: .
    image: ${CVFREE_IMAGE:-cvfree:latest}
    container_name: cvfree
    restart: unless-stopped
    ports:
      # With the https profile set CVFREE_BIND=127.0.0.1, so only Caddy is reachable from outside.
      - "${CVFREE_BIND:-0.0.0.0}:${CVFREE_PORT:-3000}:3000"
    environment:
      CVFREE_PASSWORD: ${CVFREE_PASSWORD:-}
      CVFREE_MCP_TOKEN: ${CVFREE_MCP_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - cvfree-data:/data
    # Lets the container reach services on the host, such as a local Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    container_name: cvfree-caddy
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to cvfree:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - cvfree

volumes:
  cvfree-data:
  caddy-data:
